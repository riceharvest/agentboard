[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentboard"
version = "0.2.0"
description = "Self-hosted task board for AI coding agents: runner, intelligence tiers, quota tracking, messaging, watchers, GitHub sync."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["agents", "claude-code", "kanban", "task-queue", "mcp", "llm"]

[project.scripts]
ab = "agentboard.cli:main"
agentboard = "agentboard.cli:main"

[project.urls]
Homepage = "https://github.com/riceharvest/agentboard"

[tool.setuptools]
packages = ["agentboard"]

[tool.setuptools.package-data]
agentboard = ["GUIDE.md", "snapshot.schema.json"]
