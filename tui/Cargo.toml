[package]
name = "ab-tui"
version = "0.1.0"
edition = "2021"
description = "Live terminal dashboard and control panel for agentboard (reads `ab snapshot --json`, acts through `ab` verbs)"
license = "MIT"
repository = "https://github.com/riceharvest/agentboard"
rust-version = "1.88"

[[bin]]
name = "ab-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
tachyonfx = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
libc = "0.2"
unicode-width = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
